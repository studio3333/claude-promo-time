<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (location.hostname === "claude-promo-time.pages.dev") {
        location.replace(
          "https://claude-peak-time.pages.dev" +
            location.pathname +
            location.search +
            location.hash,
        );
      }
    </script>
    <title>Is it Claude Peak Time?</title>
    <meta
      name="description"
      content="Check if Claude's session limits are active right now. Peak hours are Mon–Fri 13:00–19:00 UTC (5–11 AM PST / 6 AM–noon PDT)."
    />
    <meta property="og:title" content="Is it Claude Peak Time?" />
    <meta
      property="og:description"
      content="Find out if Claude peak hours (session limits) are active right now in your local time. Weekdays 13:00–19:00 UTC."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <button
      class="top-btn notif-toggle"
      id="notifToggle"
      aria-label="Toggle notifications"
      title="Notifications off"
    ></button>
    <button
      class="top-btn theme-toggle"
      id="themeToggle"
      aria-label="Toggle theme"
    ></button>

    <main>
      <h1>Claude Peak Hours</h1>

      <div id="answer"></div>
      <div id="subtitle"></div>

      <div id="countdown"></div>
      <div id="countdown-label"></div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="notif-banner" id="notifBanner" style="display: none">
        <svg viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="notif-banner-text"
          >Get notified when peak hours start or end</span
        >
        <button class="notif-banner-btn" id="notifBannerBtn">
          Turn on notifications
        </button>
        <button
          class="notif-banner-close"
          id="notifBannerClose"
          aria-label="Close"
        >
          &times;
        </button>
      </div>

      <div class="weekly-timeline" id="weeklyTimeline">
        <div class="weekly-timeline-label">Weekly overview</div>
        <div class="wt-days" id="wtDays"></div>
        <div class="wt-legend">
          <span class="wt-legend-item"
            ><span class="wt-legend-swatch peak"></span>peak</span
          >
          <span class="wt-legend-item"
            ><span class="wt-legend-swatch offpeak"></span>off-peak</span
          >
        </div>
      </div>

      <div class="tz-info" id="tzInfo"></div>

      <div class="info-card" id="statusCard" style="display: none">
        <h2>Service status</h2>
        <div id="statusRows"></div>
        <a
          class="status-link"
          href="https://status.claude.com"
          target="_blank"
          rel="noopener"
          >status.claude.com &rarr;</a
        >
      </div>

      <!-- EthicalAds (後で有効化: YOUR-PUBLISHER-ID を ethicalads.io の Publisher ID に変更)
      <div class="ea-wrap">
        <div data-ea-publisher="YOUR-PUBLISHER-ID" data-ea-type="image"></div>
      </div>
      -->

      <div class="kofi-wrap">
        <a
          class="kofi-link"
          href="https://ko-fi.com/studio3333"
          target="_blank"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
            <line x1="6" y1="1" x2="6" y2="4" />
            <line x1="10" y1="1" x2="10" y2="4" />
            <line x1="14" y1="1" x2="14" y2="4" />
          </svg>
          Support this project
        </a>
      </div>

      <footer>
        <p>
          <a href="https://support.claude.com" target="_blank" rel="noopener"
            >support.claude.com</a
          >
        </p>
        <p style="margin-top: 0.3rem">Not affiliated with Anthropic</p>
        <p style="margin-top: 0.3rem">© studio3333</p>
        <p style="margin-top: 0.3rem"><a href="https://studio3333.github.io/tokushoho/" target="_blank" rel="noopener">特定商取引法に基づく表記</a></p>
      </footer>
    </main>

    <script src="app.js" defer></script>
    <!-- EthicalAds スクリプト (後で有効化)
    <script
      async
      src="https://media.ethicalads.io/media/client/ethicalads.min.js"
    ></script>
    -->
  </body>
</html>
