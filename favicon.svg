<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <!-- Clock circle -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#34d399" stroke-width="2"/>
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="21" y2="19" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#34d399"/>
</svg>
